services:
  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: capstone-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: capstone-api
    depends_on:
      - qdrant
    env_file:
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: customer_support_policies
      APP_ENV: production
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  qdrant_storage:

